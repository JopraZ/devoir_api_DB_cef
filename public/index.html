<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Port de plaisance</title>


  <link rel="stylesheet" href="/css/index.css">
</head>

<body>
  <main class="container">

    <header class="header">
      <h1>Port de plaisance de Russell</h1>
      <p class="subtitle">
        Application de gestion des réservations de catways
      </p>
    </header>

    <section class="card">

      <div class="presentation">
        <h2>Bienvenue</h2>
        <p>
          Cette application permet à la capitainerie de gérer les catways,
          les réservations et les utilisateurs via une API sécurisée.
        </p>
      </div>

      <form class="login-form" id="login-form">
        <h3>Connexion</h3>

        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" required />

        <label for="email">Email</label>
        <input type="email" id="email" required />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" required />

        <button type="submit">Se connecter</button>
      </form>

      <div class="doc-link">
        <a href="api-doc.html">📘 Accéder à la documentation de l’API</a>
      </div>

    </section>

  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
